# This GitHub Action automates the process of building and releasing Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v0.1.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and package plugin
        id: build
        uses: grafana/plugin-actions/build-plugin@build-plugin/v1.0.2
        with:
          go-version: '1.26'
          # policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          # NOTE: policy_token is commented out because public community plugins cannot
          # be signed before they are approved by the Grafana plugin review team.
          # Grafana's publishing system will automatically sign the plugin during the review/listing process.

      - name: Extract CHANGELOG excerpt
        id: changelog
        run: |
          # Extract the section for the current tag version
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          # GitHub Actions multi-line output
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Wazuh datasource ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            *.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
