# Package and publish release ZIPs from CHANGELOG.md — no maintainer boilerplate in release notes.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and package plugin
        id: build
        uses: grafana/plugin-actions/package-plugin@package-plugin/v1.2.0
        with:
          go-version: '1.26.4'
          node-version: '22'

      - name: Extract CHANGELOG excerpt
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Wazuh datasource ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.archive-sha1sum }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
