apiVersion: 1

datasources:
  - name: 'Wazuh'
    type: 'wazuh-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      # Use host.containers.internal (not localhost) — the plugin backend runs inside Grafana's container.
      managerUrl: 'https://host.containers.internal:55000'
      indexerUrl: 'https://host.containers.internal:9200'
      username: 'wazuh-wui'
      tlsSkipVerify: true
    secureJsonData:
      password: 'wazuh-wui'
