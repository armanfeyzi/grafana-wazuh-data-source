services:
  grafana:
    user: root
    container_name: wazuh-datasource

    ports:
      - 3000:3000/tcp
      - 2345:2345/tcp
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    volumes:
      # Paths are relative to the project root (where docker-compose.yaml lives).
      # :Z relabels content for SELinux when using Podman on Fedora.
      - ./dist:/var/lib/grafana/plugins/wazuh-datasource:Z
      - ./provisioning:/etc/grafana/provisioning:Z
      - ./dist/dashboards:/etc/grafana/provisioning/dashboards/wazuh:Z
      - .:/root/wazuh-datasource:Z

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.wazuh-datasource:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: wazuh-datasource
